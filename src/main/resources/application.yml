spring:
  application:
    name: plan2agent-memory
  datasource:
    url: ${P2A_DB_URL:jdbc:postgresql://localhost:5432/p2a_artifact_store}
    username: ${P2A_DB_USERNAME:p2a}
    password: ${P2A_DB_PASSWORD:p2a_local_password}
  flyway:
    enabled: true
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true

p2a:
  embedding:
    provider: ${P2A_EMBEDDING_PROVIDER:none}
  memory:
    embedding:
      worker:
        enabled: ${P2A_MEMORY_EMBEDDING_WORKER_ENABLED:true}
        poll-delay: ${P2A_MEMORY_EMBEDDING_WORKER_POLL_DELAY:1s}
        claim-batch-size: ${P2A_MEMORY_EMBEDDING_WORKER_CLAIM_BATCH_SIZE:16}
        concurrency: ${P2A_MEMORY_EMBEDDING_WORKER_CONCURRENCY:1}
        lease-duration: ${P2A_MEMORY_EMBEDDING_WORKER_LEASE_DURATION:2m}
  security:
    header-name: ${P2A_LOCAL_TOKEN_HEADER:X-P2A-Local-Token}
    token: ${P2A_LOCAL_TOKEN:}
    protected-paths:
      - /api/**
    excluded-paths:
      - /api/health
      - /actuator/health
      - /actuator/metrics
      - /actuator/metrics/**

server:
  port: ${PORT:8080}
